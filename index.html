<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>OOC 공방</title>
<meta property="og:title" content="OOC 공방">
<meta name="description" content="OOC를 만들고 저장하고 공유하는 곳">
<meta property="og:description" content="OOC를 만들고 저장하고 공유하는 곳">
<meta property="og:site_name" content="OOC 공방">
<meta name="twitter:description" content="OOC를 만들고 저장하고 공유하는 곳">
<meta property="og:type" content="website">
<meta property="og:url" content="https://dengdeng-ai.github.io/ooc-maker/">
<meta property="og:image" content="https://dengdeng-ai.github.io/ooc-maker/og.png?v=4">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary">
<meta name="twitter:image" content="https://dengdeng-ai.github.io/ooc-maker/og-square.png?v=1">
<link rel="icon" href="favicon.svg?v=3" type="image/svg+xml">
<link rel="icon" href="favicon-32.png?v=3" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=3">
<meta name="twitter:title" content="OOC 공방">
<script>
  try{
    var t=localStorage.getItem('ooc.theme');
    if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.classList.add('dark');
  }catch(e){}
</script>
<style>
  :root{ color-scheme:light;
    --bg:#f2f5f8; --card:#ffffff; --text:#2d3844; --sub:#7d8b99; --line:#e0e7ed;
    --accent:#84a3c4; --accent-soft:#eaf0f5; --on-accent:#ffffff; --warn:#b4542a; --warn-soft:#f8ede6; --ok:#567696; --ok-soft:#eaf0f5;
  }
  html.dark{ color-scheme:dark;
    --bg:#14191e; --card:#1b2229; --text:#e6ecf1; --sub:#93a2ae; --line:#28323b;
    --accent:#95afca; --accent-soft:#202a33; --on-accent:#14191e; --warn:#e0956a; --warn-soft:#3a2a20; --ok:#aec3d8; --ok-soft:#202a33;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
    font-size:14px;line-height:1.5}
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
  .head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
  h1{font-size:20px;margin:0;font-weight:700}
  .theme-btn{border:0;background:none;color:var(--sub);padding:4px;display:flex;align-items:center;cursor:pointer;flex-shrink:0}
  .theme-btn:hover{color:var(--text)}
  .theme-btn svg{width:19px;height:19px}
  .hidden{display:none!important}
  .home{color:inherit;text-decoration:none}
  .pill{font-size:13px;font-weight:600;color:var(--ok);background:var(--card);border:1px solid var(--line);padding:5px 12px;border-radius:20px;text-decoration:none;white-space:nowrap}
  .pill:active{opacity:.7}
  .title-row{display:flex;align-items:center;gap:6px}
  .back{display:flex;color:var(--text);margin-left:-6px;padding:4px}
  .back svg{width:22px;height:22px}
  #view pre.detail{max-height:none}
  #view .snips{margin:0}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:14px}
  .card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:10px}
  .card-head .t{font-weight:600}
  .card-head .t small{color:var(--sub);font-weight:400;margin-left:6px}
  .link{background:none;border:0;color:var(--sub);cursor:pointer;font:inherit;padding:0}
  .link:hover{color:var(--text)}

  input[type=text],input[type=search],input[type=email],input[type=password],textarea{-webkit-appearance:none;appearance:none;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0;outline:none}
  input,textarea,select{font-size:16px!important}
  input:focus,textarea:focus{border-color:var(--accent)}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  textarea{resize:vertical;min-height:240px;line-height:1.6;display:block}
  @media (max-width:480px){ #fBody{min-height:150px;height:190px} }
  .fields{margin-bottom:8px}

  .snips{--g:6px;display:flex;flex-wrap:wrap;gap:var(--g);margin-bottom:8px}
  .snips .snip{flex:1 1 auto;text-align:center}
  .snip-br{flex-basis:100%;height:0;margin-top:calc(-1 * var(--g))}
  .snips.measure .snip{flex:none!important}
  .btn.icon{flex:none;width:46px;padding:0;display:flex;align-items:center;justify-content:center;color:var(--sub)}
  .btn.icon svg{width:18px;height:18px}
  @media (max-width:480px){ .snips{--g:5px} .snip{padding:4px 8px} .snips.editing .snip{padding-right:22px} .snip .del{right:6px} }
  .snip{position:relative;font:inherit;font-size:13px;padding:4px 11px;border-radius:20px;border:0;background:var(--accent-soft);color:var(--ok);cursor:pointer;white-space:nowrap;-webkit-user-select:none;user-select:none}
  .snip:hover{filter:brightness(.97)}
  html.dark .snip:hover{filter:brightness(1.15)}
  .snip.mono{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px}
  .snips.editing .snip{padding-right:26px}
  .snip .del{display:none;position:absolute;right:7px;top:50%;transform:translateY(-50%);color:var(--warn);font-size:14px;line-height:1}
  .snips.editing .snip .del{display:block}
  .snip.sel{outline:1.5px solid var(--accent)}
  .snip-add{display:flex;flex-direction:column;gap:6px;margin-bottom:10px;padding:12px;background:var(--bg);border-radius:10px}
  .snip-add input,.snip-add textarea{background:var(--card)}
  .snip-add textarea{min-height:64px;resize:vertical}
  .snip-add .bar{margin-top:0;justify-content:flex-end}

  .bar{display:flex;gap:8px;margin-top:10px}
  .badge{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:20px;background:var(--warn-soft);color:var(--warn);margin-right:4px;vertical-align:1px}
  .meta{font-size:12px;color:var(--sub);margin-top:2px;display:flex;align-items:center;gap:4px}
  .meta svg{width:12px;height:12px}
  .post-row{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:12px;border-top:1px solid var(--line)}
  .chk{display:flex;align-items:center;gap:6px;color:var(--text);cursor:pointer;-webkit-user-select:none;user-select:none}
  .chk input{width:17px;height:17px;margin:0;accent-color:var(--accent)}
  .post-row .btn{flex:1}
  .sbtn{margin:-6px -4px}
  .sbtn.on{color:var(--text)}
  .sbtn.spin svg{animation:spin .6s linear}
  @keyframes spin{to{transform:rotate(360deg)}}
  .note{font-size:13px;color:var(--sub);margin-top:2px;word-break:keep-all;overflow-wrap:anywhere}
  #eItems textarea{min-height:120px;margin-top:6px}
  #eItems .sub{margin-top:12px}
  #eItems .sub input{margin-top:0}
  .fold-t{border:0;background:none;padding:0;font:inherit;font-weight:600;color:var(--text);cursor:pointer;display:flex;align-items:center;gap:0}
  .fold-ic{display:flex;color:var(--sub);margin-left:6px}
  .fold-ic svg{width:16px;height:16px;transition:transform .15s}
  #savedCard.folded .fold-ic svg{transform:rotate(-90deg)}
  #savedCard.folded #savedBody, #savedCard.folded #q, #savedCard.folded #selBar, #savedCard.folded #qBtn, #savedCard.folded #shareList{display:none!important}
  #savedCard.folded .card-head{margin-bottom:0}
  #list .body{max-height:3.2em}
  #list .body.open{max-height:none}
  .dl{display:inline-flex;align-items:center;gap:3px;opacity:.75}
  .dl svg{width:12px;height:12px}
  .sortbar{display:flex;gap:6px;margin-bottom:4px}
  .sortbar .chip{font-size:12px;padding:3px 11px}
  .badge.soft{background:var(--accent-soft);color:var(--ok)}
  .sub{margin-top:10px;padding-left:10px;border-left:2px solid var(--line)}
  .sub-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .sub-name{font-size:13px;font-weight:600;word-break:break-word}
  .sub .body{margin-top:2px}
  #board .body{max-height:4.7em}
  #board .body.open{max-height:none}
  .sub-list{display:flex;align-items:center;gap:6px;margin-top:8px;padding:8px 10px;border-radius:8px;background:var(--bg);color:var(--sub);font-size:13px;cursor:pointer;-webkit-user-select:none;user-select:none}
  .sub-list span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sub-list svg{width:15px;height:15px;flex-shrink:0;transition:transform .15s}
  .sub-list.open svg{transform:rotate(180deg)}
  .selbar{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .selbar .selcount{flex:1;color:var(--sub);font-size:13px}
  .cbox{width:20px;height:20px;border-radius:6px;border:1.5px solid var(--line);flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--on-accent);margin-top:1px}
  .cbox{font-size:12px;font-weight:700;line-height:1}
  .cbox.on{background:var(--accent);border-color:var(--accent)}
  #list.selecting .item{cursor:pointer}
  .more{display:block;width:100%;margin-top:8px}
  .foot{text-align:center;margin-top:18px;font-size:12px}
  .foot .link{font-size:12px;opacity:.7}
  .count{text-align:right;font-size:12px;color:var(--sub);margin-top:5px}
  .count + .bar{margin-top:6px}
  #pubPanel input + input{margin-top:8px}
  #pubPanel .lbl2{font-size:12px;color:var(--sub);margin:0 0 8px}
  #view.owner [data-v=save]{display:none}
  .btn{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--text);font:inherit;cursor:pointer;white-space:nowrap}
  .btn.main{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
  .btn.soft{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--ok);font-weight:600}
  .btn.sm{flex:none;padding:6px 12px;border-radius:8px}
  .btn:disabled{opacity:.5;cursor:default}

  .search{margin-bottom:10px}
  .chip{font:inherit;font-size:11.5px;padding:2px 9px;border-radius:20px;background:var(--bg);color:var(--sub);border:0;white-space:nowrap}
  button.chip{cursor:pointer}
  .chip.on{background:var(--accent);color:var(--on-accent)}

  .item{padding:12px 0;border-top:1px solid var(--line)}
  .item:first-child{border-top:0}
  .item.cur{background:linear-gradient(90deg,var(--accent-soft),transparent);margin:0 -18px;padding:12px 18px}
  .item-top{display:flex;align-items:flex-start;gap:8px}
  .info{flex:1;min-width:0}
  .name{font-weight:600;word-break:break-word}
  .body{white-space:pre-wrap;word-break:break-word;margin-top:8px;max-height:6.2em;overflow:hidden;position:relative;color:var(--text);font-size:13.5px}
  .body.long{cursor:pointer}
  .body.open{max-height:none}
  .body.long:not(.open)::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2.2em;background:linear-gradient(transparent,var(--card))}
  .item.cur .body.long:not(.open)::after{display:none}
  .acts{display:flex;gap:2px;flex-shrink:0;margin:-4px -6px 0 0}
  .ib{border:0;background:none;color:var(--sub);cursor:pointer;padding:6px;border-radius:8px;display:flex}
  .ib svg{width:17px;height:17px}
  .ib:hover{color:var(--text);background:var(--accent-soft)}
  .ib.copy{color:var(--ok)}
  .ib.del:hover{color:var(--warn);background:var(--warn-soft)}
  .empty{color:var(--sub);text-align:center;padding:14px 0 4px;font-size:13px}

  .row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .lbl{width:76px;color:var(--sub);flex-shrink:0}

  .modal{position:fixed;inset:0;background:rgba(20,25,30,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
  .modal.show{display:flex}
  .modal .card{width:100%;max-width:560px;max-height:90vh;overflow:auto;margin:0}
  pre.detail{margin:10px 0 0;padding:12px;background:var(--bg);border-radius:8px;font:inherit;font-size:13.5px;white-space:pre-wrap;word-break:break-word;max-height:50vh;overflow:auto}

  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);background:var(--accent);color:var(--on-accent);font-size:13px;font-weight:600;padding:8px 16px;border-radius:20px;opacity:0;transition:.18s;pointer-events:none;z-index:60;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="wrap" id="main">
  <div class="head"><h1>OOC 공방</h1><div class="row" style="gap:14px"><a class="pill" href="#board">공유 게시판</a><button class="theme-btn" id="themeBtn" aria-label="다크 모드 전환"></button></div></div>

  <div class="card" id="composer">
    <div class="card-head">
      <div class="t" id="compTitle"></div>
      <div class="row" style="gap:12px">
        <button class="link hidden" id="cancelEdit">수정 취소</button>
        <button class="link" id="snipEdit">단축키 편집</button>
      </div>
    </div>
    <div class="fields">
      <input type="text" id="fTitle" placeholder="제목 (선택)">
    </div>
    <div class="snips" id="snips"></div>
    <div class="snip-add hidden" id="snipAdd">
      <input type="text" id="snipLabel" placeholder="단축키 이름">
      <textarea id="snipText" placeholder="들어갈 내용 (비우면 단축키 이름 그대로)"></textarea>
      <div class="bar">
        <button class="btn sm" id="snipReset">기본값</button>
        <button class="btn sm hidden" id="snipCancel">취소</button>
        <button class="btn sm soft" id="snipAddBtn">추가</button>
      </div>
    </div>
    <textarea id="fBody" spellcheck="false"></textarea>
    <div class="count" id="charCount">0자</div>
    <div class="bar">
      <button class="btn icon" id="clearBtn" title="비우기" aria-label="비우기"></button>
      <button class="btn icon" id="swapBtn" title="{{char}}↔{{user}}, NPC↔PC" aria-label="표현 전환"></button>
      <button class="btn" id="shareNow">게시</button>
      <button class="btn soft" id="copyNow">복사</button>
      <button class="btn main" id="saveBtn">저장</button>
    </div>
  </div>

  <div class="card" id="savedCard">
    <div class="card-head">
      <button class="t fold-t" id="savedFold">저장한 OOC<small id="count">0개</small><span class="fold-ic" id="savedFoldIc"></span></button>
      <div class="row" style="gap:10px"><button class="ib sbtn" id="qBtn" title="검색" aria-label="검색"></button><button class="ib sbtn" id="shareList" title="목록을 링크로 공유" aria-label="목록을 링크로 공유"></button></div>
    </div>
    <input type="search" id="q" class="search hidden" placeholder="검색">
    <div class="selbar hidden" id="selBar">
      <button class="link" id="selAll">전체 선택</button>
      <span class="selcount" id="selCount"></span>
      <button class="btn sm" id="selCancel">취소</button>
      <button class="btn sm main" id="selShare">게시</button>
    </div>
    <div id="savedBody">
      <div id="list"></div>
      <button class="btn sm more hidden" id="listMore">더 보기</button>
    </div>
  </div>

  <div class="card">
    <div class="card-head" style="margin-bottom:0"><div class="t">백업</div></div>
    <div class="note" style="margin-top:4px">저장한 OOC는 현재 브라우저에만 보관됩니다.</div>
    <div class="bar">
      <button class="btn" id="importBtn">불러오기</button>
      <button class="btn soft" id="exportBtn">내보내기</button>
    </div>
  </div>
</div>

<div class="wrap hidden" id="boardPage">
  <div class="head"><div class="title-row"><a class="back" href="#" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><h1>OOC 게시판</h1></div><button class="theme-btn" aria-label="다크 모드 전환"></button></div>
  <div class="card">
    <div class="card-head">
      <div class="t"></div>
      <div class="row" style="gap:10px"><button class="link hidden" id="adminOut">로그아웃</button><button class="ib sbtn" id="bqBtn" title="검색" aria-label="검색"></button><button class="ib sbtn" id="boardReload" title="새로고침" aria-label="새로고침"></button></div>
    </div>
    <input type="search" id="bq" class="search hidden" placeholder="검색">
    <div class="sortbar" id="bsort"><button class="chip on" data-s="new">최신순</button><button class="chip" data-s="top">인기순</button></div>
    <div id="board"></div>
    <button class="btn sm more hidden" id="boardMore">더 보기</button>
  </div>
  <div class="foot"><button class="link" id="adminIn">관리자 로그인</button></div>
</div>

<div class="wrap hidden" id="view">
  <div class="head"><div class="title-row"><a class="back" id="homeLink" href="./" aria-label="뒤로"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a><h1 id="viewH">OOC 공방</h1></div><div class="row" style="gap:14px"><button class="ib sbtn hidden" id="postLink" title="링크 복사" aria-label="링크 복사"></button><button class="theme-btn" aria-label="다크 모드 전환"></button></div></div>
  <div id="viewBody"></div>
  <div class="card hidden" id="pubPanel">
    <input type="text" id="lSeries" class="hidden" maxlength="60" placeholder="세트 제목">
    <input type="text" id="lNote" maxlength="100" placeholder="한 줄 설명 (선택)">
    <label class="chk" style="margin:12px 0 10px"><input type="checkbox" id="lAdult">성인</label>
    <input type="text" id="lPw" placeholder="비밀번호 (선택)" autocomplete="off" autocapitalize="off" spellcheck="false" style="margin-top:0">
    <div class="bar">
      <button class="btn soft hidden" id="lShare">공유</button>
      <button class="btn main" id="lCopy">링크 복사</button>
    </div>
    <div class="post-row hidden" id="postRow">
      <button class="btn soft" id="postBtn" style="margin-left:0">공유 게시판에 올리기</button>
    </div>
  </div>
</div>

<div class="modal" id="copyBox">
  <div class="card">
    <div class="name">직접 복사</div>
    <textarea id="cText" readonly style="margin-top:10px;min-height:140px"></textarea>
    <div class="bar"><button class="btn" id="cClose">닫기</button></div>
  </div>
</div>

<div class="modal" id="draftBox">
  <div class="card">
    <div class="name">작성 중이던 내용이 있습니다. 불러오시겠습니까?</div>
    <pre class="detail" id="dPreview" style="max-height:30vh"></pre>
    <div class="bar">
      <button class="btn" id="dDrop">삭제</button>
      <button class="btn main" id="dLoad">불러오기</button>
    </div>
  </div>
</div>

<div class="modal" id="editBox">
  <div class="card">
    <div class="name">게시물 수정</div>
    <input type="text" id="eTitle" maxlength="60" placeholder="제목" style="margin-top:10px">
    <input type="text" id="eNote" maxlength="100" placeholder="한 줄 설명 (선택)" style="margin-top:8px">
    <div id="eItems"></div>
    <div class="bar">
      <button class="btn" id="eClose">취소</button>
      <button class="btn main" id="eSave">저장</button>
    </div>
  </div>
</div>

<div class="modal" id="adminBox">
  <div class="card">
    <div class="name">관리자 로그인</div>
    <input type="email" id="aEmail" placeholder="이메일" autocomplete="username" autocapitalize="off" style="margin-top:10px">
    <input type="password" id="aPw" placeholder="비밀번호" autocomplete="current-password" style="margin-top:8px">
    <div class="bar">
      <button class="btn" id="aClose">닫기</button>
      <button class="btn main" id="aLogin">로그인</button>
    </div>
  </div>
</div>

<div class="modal" id="lockBox">
  <div class="card">
    <div class="name">비밀번호</div>
    <input type="text" id="uPw" autocomplete="off" autocapitalize="off" spellcheck="false" style="margin-top:10px">
    <div class="bar">
      <button class="btn" id="uClose">닫기</button>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const KEY = 'ooc.items.v1';
const SNIP_KEY = 'ooc.snips.v13';
const DEFAULT_SNIPS = [
  { l: '**', x: '**' },
  { l: '[]', x: '[]' },
  { l: '()', x: '()' },
  { l: 'OOC:', x: 'OOC:' },
  { l: '#', x: '#' },
  { l: '{{char}}', x: '{{char}}' },
  { l: '{{user}}', x: '{{user}}' },
  { l: 'NPC', x: 'NPC' },
  { l: 'PC', x: 'PC' },
  { l: '새 에피소드', x: '현재 RP를 중지한다. 새 에피소드를 시작한다.' },
  { l: 'AI로 답변', x: '현재 RP를 중지한다. AI로서 답변한다.' },
  { l: '시간 경과', x: '시간이 흐른다.' }
];
const toSnip = v => {
  if (typeof v === 'string') return v.trim() ? { l: v.trim(), x: v } : null;
  if (v && typeof v === 'object' && String(v.l ?? '').trim()) return { l: String(v.l).trim(), x: String(v.x ?? '') || String(v.l).trim() };
  return null;
};
const PAIRS = { '**':['*','*'], '[]':['[',']'], '()':['(',')'], '""':['"','"'], "''":["'","'"], '<>':['<','>'], '{}':['{','}'], '「」':['「','」'], '『』':['『','』'], '~~':['~','~'] };

const svg = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
const ICON = {
  copy: svg('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>'),
  done: svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),
  share: svg('<path d="M12 15V4"/><path d="M8 8l4-4 4 4"/><path d="M5 13v6a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6"/>'),
  edit: svg('<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13.5 6.5l4 4"/>'),
  del: svg('<path d="M5 7h14"/><path d="M10 11v6M14 11v6"/><path d="M6 7l1 13h10l1-13"/><path d="M9 7V4h6v3"/>'),
  lock: svg('<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
  flag: svg('<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>'),
  swap: svg('<path d="M7 7h12"/><path d="M15 3l4 4-4 4"/><path d="M17 17H5"/><path d="M9 13l-4 4 4 4"/>'),
  search: svg('<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>'),
  reload: svg('<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>'),
  link: svg('<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>'),
  down: svg('<path d="M6 9l6 6 6-6"/>'),
  save: svg('<path d="M12 4v11"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/>'),
  moon: svg('<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>'),
  sun: svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>')
};

function setTheme(dark){
  document.documentElement.classList.toggle('dark', dark);
  document.querySelectorAll('.theme-btn').forEach(b => { b.innerHTML = dark ? ICON.sun : ICON.moon; b.title = dark ? '밝은 화면' : '다크 모드'; });
  try { localStorage.setItem('ooc.theme', dark ? 'dark' : 'light'); } catch(e){}
}
$('#clearBtn').innerHTML = ICON.del;
$('#qBtn').innerHTML = ICON.search;
$('#savedFoldIc').innerHTML = ICON.down;
if (readLS('ooc.savedFolded.v1')) $('#savedCard').classList.add('folded');
$('#savedFold').onclick = () => {
  const f = $('#savedCard').classList.toggle('folded');
  writeLS('ooc.savedFolded.v1', f);
  if (!f) render();
};
$('#postLink').innerHTML = ICON.link;
$('#shareList').innerHTML = ICON.link;
$('#bqBtn').innerHTML = ICON.search;
$('#boardReload').innerHTML = ICON.reload;
$('#swapBtn').innerHTML = ICON.swap;
document.querySelectorAll('.theme-btn').forEach(b => { b.innerHTML = document.documentElement.classList.contains('dark') ? ICON.sun : ICON.moon; b.onclick = () => setTheme(!document.documentElement.classList.contains('dark')); });

let items = [];
let snips = [];
let filterTag = null;
let editingId = null;
let sharedItem = null;

function readLS(k){ try { return JSON.parse(localStorage.getItem(k)); } catch(e){ return null; } }
function writeLS(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){ toast('저장하지 못했습니다.'); } }
const saveItems = () => writeLS(KEY, items);
const saveSnips = () => writeLS(SNIP_KEY, snips);
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function normalize(o){
  const c = String(o.c ?? o.content ?? '').replace(/\s+$/, '');
  if (!c.trim()) return null;
  const t = String(o.t ?? o.title ?? '').trim() || c.trim().split('\n')[0].slice(0, 30);
  return { id: uid(), t, g: [], c, at: Date.now() };
}

let toastTimer;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 1400);
}
function legacyCopy(text){
  const t = document.createElement('textarea');
  t.value = text;
  t.setAttribute('readonly', '');
  t.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;font-size:16px';
  document.body.appendChild(t);
  t.focus({ preventScroll: true });
  t.select();
  t.setSelectionRange(0, text.length);
  let ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  t.remove();
  return ok;
}
async function copyText(text, msg){
  let ok = legacyCopy(text);
  if (!ok && navigator.clipboard && window.isSecureContext) {
    try { await navigator.clipboard.writeText(text); ok = true; } catch(e){}
  }
  if (ok) { toast(msg || '복사되었습니다.'); return; }
  $('#cText').value = text;
  $('#copyBox').classList.add('show');
  setTimeout(() => { $('#cText').focus(); $('#cText').setSelectionRange(0, text.length); }, 50);
}

const ta = $('#fBody');
let sel = { s: 0, e: 0 };
['select','keyup','mouseup','input'].forEach(ev => ta.addEventListener(ev, () => { sel = { s: ta.selectionStart, e: ta.selectionEnd }; }));
document.addEventListener('selectionchange', () => { if (document.activeElement === ta) sel = { s: ta.selectionStart, e: ta.selectionEnd }; });
function updateCount(){ $('#charCount').textContent = [...ta.value].length.toLocaleString() + '자'; if (typeof saveDraft === 'function') saveDraft(); }
ta.addEventListener('input', updateCount);


function insertSnip(text){
  const pair = PAIRS[text];
  const { s, e } = sel;
  const before = ta.value.slice(0, s), picked = ta.value.slice(s, e);
  let ins, caretS, caretE;
  if (pair) {
    const lead = (!picked && before && !/[\s\[(*"「『{]$/.test(before)) ? ' ' : '';
    ins = lead + pair[0] + picked + pair[1];
    caretS = picked ? s + ins.length : s + lead.length + pair[0].length; caretE = caretS;
  } else {
    const block = false;
    const needNL = block && before && !/\n$/.test(before);
    const needSpaceBefore = !block && before && !/\s$/.test(before) && /^[A-Za-z가-힣{]/.test(text) && !/[\[(*"「『{]$/.test(before);
    const trail = /[:#]$/.test(text) && !/^\s/.test(ta.value.slice(e)) ? ' ' : '';
    ins = (needNL ? '\n' : needSpaceBefore ? ' ' : '') + text + trail;
    caretS = caretE = s + ins.length;
  }
  ta.focus();
  ta.setSelectionRange(s, e);
  let ok = false;
  try { ok = document.execCommand('insertText', false, ins); } catch(err){}
  if (!ok) ta.setRangeText(ins, s, e, 'end');
  ta.setSelectionRange(caretS, caretE);
  sel = { s: caretS, e: caretE };
  updateCount();
}

function renderSnips(){
  const kind = s => s.x !== s.l ? 2 : (PAIRS[s.l] || s.l === 'OOC:' || s.l === '#') ? 0 : 1;
  let prev = null;
  $('#snips').innerHTML = snips.map((s, i) => {
    const k = kind(s), br = prev !== null && k !== prev ? '<i class="snip-br"></i>' : '';
    prev = k;
    return br + `<button class="snip${PAIRS[s.l] ? ' mono' : ''}${i === snipIdx ? ' sel' : ''}" data-i="${i}" title="${esc(s.x)}">${esc(s.l)}<span class="del">×</span></button>`;
  }).join('');
  layoutSnips();
}
function layoutSnips(){
  const box = $('#snips');
  box.querySelectorAll('.snip-br.auto').forEach(e => e.remove());
  const W = box.clientWidth; if (!W) return;
  const gap = parseFloat(getComputedStyle(box).columnGap) || 6;
  const groups = [[]];
  [...box.children].forEach(el => { if (el.classList.contains('snip-br')) groups.push([]); else groups[groups.length - 1].push(el); });
  box.classList.add('measure');
  const widths = groups.map(g => g.map(e => e.getBoundingClientRect().width));
  box.classList.remove('measure');
  groups.forEach((g, gi) => {
    const w = widths[gi]; if (g.length < 3) return;
    let rows = 1, cur = 0;
    w.forEach(x => { if (cur && cur + gap + x > W) { rows++; cur = x; } else cur = cur ? cur + gap + x : x; });
    if (rows < 2) return;
    const per = Math.ceil(g.length / rows);
    for (let i = 0; i < g.length; i += per) {
      const part = w.slice(i, i + per);
      if (part.reduce((a, b) => a + b, 0) + gap * (part.length - 1) > W) return;
    }
    for (let i = per; i < g.length; i += per) { const br = document.createElement('i'); br.className = 'snip-br auto'; g[i].before(br); }
  });
}
let layoutTimer;
window.addEventListener('resize', () => { clearTimeout(layoutTimer); layoutTimer = setTimeout(layoutSnips, 100); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(layoutSnips);
let snipIdx = -1;
function resetSnipForm(){
  snipIdx = -1;
  $('#snipLabel').value = ''; $('#snipText').value = '';
  $('#snipAddBtn').textContent = '추가';
  $('#snipCancel').classList.add('hidden');
  renderSnips();
}
$('#snips').addEventListener('mousedown', e => { if (e.target.closest('.snip')) e.preventDefault(); });
let touchSnip = null;
$('#snips').addEventListener('touchstart', e => {
  const b = e.target.closest('.snip'); if (!b) return;
  e.preventDefault(); touchSnip = b;
}, { passive: false });
$('#snips').addEventListener('touchend', e => {
  const b = touchSnip; touchSnip = null; if (!b) return;
  const t = e.changedTouches[0];
  const el = document.elementFromPoint(t.clientX, t.clientY);
  if (!el || el.closest('.snip') !== b) return;
  e.preventDefault();
  handleSnip(b, el);
}, { passive: false });
$('#snips').addEventListener('touchcancel', () => { touchSnip = null; });
$('#snips').onclick = e => {
  const b = e.target.closest('.snip'); if (!b) return;
  handleSnip(b, e.target);
};
function handleSnip(b, target){
  const i = +b.dataset.i;
  if (!$('#snips').classList.contains('editing')) { insertSnip(snips[i].x); return; }
  if (target.closest('.del')) {
    snips.splice(i, 1); saveSnips(); resetSnipForm(); return;
  }
  snipIdx = i;
  $('#snipLabel').value = snips[i].l;
  $('#snipText').value = snips[i].x === snips[i].l ? '' : snips[i].x;
  $('#snipAddBtn').textContent = '수정';
  $('#snipCancel').classList.remove('hidden');
  renderSnips();
};
$('#snipEdit').onclick = () => {
  const on = $('#snips').classList.toggle('editing');
  setTimeout(layoutSnips, 0);
  $('#snipAdd').classList.toggle('hidden', !on);
  $('#snipEdit').textContent = on ? '완료' : '단축키 편집';
  resetSnipForm();
};
function addSnip(){
  const s = toSnip({ l: $('#snipLabel').value, x: $('#snipText').value });
  if (!s) { $('#snipLabel').focus(); return; }
  if (snipIdx >= 0) snips[snipIdx] = s;
  else snips.push(s);
  const was = snipIdx >= 0;
  saveSnips(); resetSnipForm(); toast(was ? '수정되었습니다.' : '추가되었습니다.');
}
$('#snipAddBtn').onclick = addSnip;
$('#snipCancel').onclick = resetSnipForm;
$('#snipLabel').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); $('#snipText').focus(); } });
$('#snipReset').onclick = () => { if (confirm('단축키를 기본값으로 되돌리시겠습니까?')) { snips = DEFAULT_SNIPS.map(s => ({ ...s })); saveSnips(); resetSnipForm(); } };

function setEditing(it){
  editingId = it ? it.id : null;
  $('#fTitle').value = it ? it.t : '';
  ta.value = it ? it.c : ''; updateCount();
  sel = { s: ta.value.length, e: ta.value.length };
  $('#compTitle').textContent = it ? '수정' : '';
  $('#cancelEdit').classList.toggle('hidden', !it);
  render();
  saveDraft();
}
const DRAFT_KEY = 'ooc.draft.v1';
let draftTimer;
let draftReady = false, draftPending = false;
function saveDraft(){
  if (!draftReady) return;
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    const t = $('#fTitle').value, c = ta.value;
    if (!t && !c) { try { localStorage.removeItem(DRAFT_KEY); } catch(e){} return; }
    writeLS(DRAFT_KEY, { t, c, e: editingId });
  }, 300);
}
ta.addEventListener('input', saveDraft);
$('#fTitle').addEventListener('input', saveDraft);
function restoreDraft(){
  const d = readLS(DRAFT_KEY);
  if (!d || !(d.t || d.c)) { draftReady = true; return; }
  $('#dPreview').textContent = (d.t ? d.t + '\n' : '') + (d.c || '');
  $('#draftBox').classList.add('show');
  $('#dLoad').onclick = () => {
    $('#draftBox').classList.remove('show');
    const it = d.e ? items.find(i => i.id === d.e) : null;
    if (it) setEditing(it);
    $('#fTitle').value = d.t || '';
    ta.value = d.c || '';
    sel = { s: ta.value.length, e: ta.value.length };
    draftReady = true; updateCount();
  };
  $('#dDrop').onclick = () => {
    $('#draftBox').classList.remove('show');
    try { localStorage.removeItem(DRAFT_KEY); } catch(e){}
    draftReady = true;
  };
}
$('#cancelEdit').onclick = () => setEditing(null);
$('#clearBtn').onclick = () => {
  if (!ta.value && !$('#fTitle').value) return;
  $('#fTitle').value = ''; ta.value = ''; updateCount(); sel = { s: 0, e: 0 }; saveDraft(); ta.focus();
};
$('#swapBtn').onclick = () => {
  const map = { '{{char}}': '{{user}}', '{{user}}': '{{char}}', 'NPC': 'PC', 'PC': 'NPC' };
  const re = /\{\{char\}\}|\{\{user\}\}|\bNPC\b|\bPC\b/g;
  if (!re.test(ta.value)) { toast('전환할 표현이 없습니다.'); return; }
  re.lastIndex = 0;
  const next = ta.value.replace(re, m => map[m]);
  ta.focus(); ta.select();
  let ok = false;
  try { ok = document.execCommand('insertText', false, next); } catch(e){}
  if (!ok) ta.value = next;
  ta.setSelectionRange(next.length, next.length);
  sel = { s: next.length, e: next.length };
  updateCount();
};
$('#copyNow').onclick = () => { if (ta.value.trim()) copyText(ta.value); };
$('#saveBtn').onclick = () => {
  const n = normalize({ t: $('#fTitle').value, c: ta.value });
  if (!n) { toast('내용을 입력해 주세요.'); return; }
  if (editingId) {
    const it = items.find(i => i.id === editingId);
    if (it) Object.assign(it, { t: n.t, g: n.g, c: n.c });
    else items.unshift(n);
  } else items.unshift(n);
  saveItems(); setEditing(null); toast('저장되었습니다.');
};

const LIST_PAGE = 5;
let listLimit = LIST_PAGE;
function visibleItems(){
  const q = $('#q').value.trim().toLowerCase();
  return items.filter(i =>
    (!filterTag || i.g.includes(filterTag)) &&
    (!q || (i.t + '\n' + i.c + '\n' + i.g.join(' ')).toLowerCase().includes(q))
  );
}
function render(){
  const q = $('#q').value.trim().toLowerCase();
  $('#count').textContent = items.length + '개';

  const all = visibleItems();
  const shown = all.slice(0, listLimit);
  $('#listMore').classList.toggle('hidden', all.length <= listLimit);
  $('#listMore').textContent = `더 보기 (${all.length - shown.length})`;

  if (!items.length) { $('#list').innerHTML = '<div class="empty">등록된 항목이 없습니다.</div>'; return; }
  if (!shown.length) { $('#list').innerHTML = '<div class="empty">검색 결과가 없습니다.</div>'; return; }

  $('#list').classList.toggle('selecting', selMode);
  $('#selBar').classList.toggle('hidden', !selMode);
  $('#selCount').textContent = selected.size + '개 선택';
  const order = [...selected];
  $('#list').innerHTML = shown.map(i => `
    <div class="item${i.id === editingId ? ' cur' : ''}" data-id="${i.id}">
      <div class="item-top">
        ${selMode ? `<span class="cbox${selected.has(i.id) ? ' on' : ''}">${selected.has(i.id) ? order.indexOf(i.id) + 1 : ''}</span>` : ''}
        <div class="info">
          <div class="name">${esc(i.t)}</div>
        </div>
        <div class="acts${selMode ? ' hidden' : ''}">
          <button class="ib copy" data-act="copy" title="복사">${ICON.copy}</button>
          <button class="ib" data-act="share" title="게시하기">${ICON.share}</button>
          <button class="ib" data-act="edit" title="수정">${ICON.edit}</button>
          <button class="ib del" data-act="del" title="삭제">${ICON.del}</button>
        </div>
      </div>
      <div class="body">${esc(i.c)}</div>
    </div>`).join('');

  document.querySelectorAll('#list .body').forEach(b => { if (b.scrollHeight > b.clientHeight + 2) b.classList.add('long'); });
}

let selMode = false;
const selected = new Set();
$('#list').onclick = e => {
  const row = e.target.closest('.item'); if (!row) return;
  const it = items.find(i => i.id === row.dataset.id); if (!it) return;
  if (selMode) { selected.has(it.id) ? selected.delete(it.id) : selected.add(it.id); render(); return; }
  const body = e.target.closest('.body');
  if (body) { if (body.classList.contains('long')) body.classList.toggle('open'); return; }
  const btn = e.target.closest('[data-act]'); if (!btn) return;
  const act = btn.dataset.act;
  if (act === 'copy') {
    copyText(it.c);
    btn.innerHTML = ICON.done; setTimeout(() => { btn.innerHTML = ICON.copy; }, 1200);
  } else if (act === 'share') share(it);
  else if (act === 'edit') { setEditing(it); $('#composer').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
  else if (act === 'del' && confirm(`'${it.t}'을(를) 삭제하시겠습니까?`)) {
    items = items.filter(i => i.id !== it.id);
    if (editingId === it.id) setEditing(null);
    saveItems(); render(); toast('삭제되었습니다.');
  }
};
$('#q').oninput = () => { listLimit = LIST_PAGE; render(); };
$('#listMore').onclick = () => { listLimit += LIST_PAGE; render(); };
function toggleSearch(btn, input, onClear){
  const show = input.classList.toggle('hidden') === false;
  btn.classList.toggle('on', show);
  if (show) input.focus();
  else if (input.value) { input.value = ''; onClear(); }
}
$('#qBtn').onclick = () => toggleSearch($('#qBtn'), $('#q'), render);

$('#cClose').onclick = () => $('#copyBox').classList.remove('show');
$('#copyBox').addEventListener('click', e => { if (e.target.id === 'copyBox') $('#copyBox').classList.remove('show'); });

const b64e = bytes => { let s = ''; bytes.forEach(x => s += String.fromCharCode(x)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); };
const b64d = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
const canZip = typeof CompressionStream === 'function' && typeof DecompressionStream === 'function';
async function pipe(bytes, stream){ return new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer()); }
async function pack(o){
  const raw = new TextEncoder().encode(JSON.stringify(o));
  if (canZip) { try { return 'z' + b64e(await pipe(raw, new CompressionStream('deflate-raw'))); } catch(e){} }
  return 'p' + b64e(raw);
}
async function unpack(s){
  let bytes = b64d(s.slice(1));
  if (s[0] === 'z') bytes = await pipe(bytes, new DecompressionStream('deflate-raw'));
  return JSON.parse(new TextDecoder().decode(bytes));
}
function legacyDec(s){ return JSON.parse(new TextDecoder().decode(b64d(s))); }

async function deriveKey(pw, salt){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt, iterations: 150000, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
}
async function lock(str, pw){
  const salt = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));

    } catch(err){ toast('처리하지 못했습니다.'); }
  } else if (act === 'del') {
    if (!confirm(`'${p.title}'을(를) 게시판에서 삭제하시겠습니까?`)) return;
    try {
      let ok;
      if (mine[p.id]) ok = await sb('/rest/v1/rpc/delete_post', { method: 'POST', body: JSON.stringify({ pid: p.id, token: mine[p.id] }) });
      if (!ok && admin) ok = ((await sb(`/rest/v1/posts?id=eq.${p.id}&select=id`, { method: 'DELETE', headers: { Prefer: 'return=representation' } })) || []).length > 0;
      if (!ok) { toast('삭제할 수 없습니다.'); return; }
      delete mine[p.id]; writeLS(MINE_KEY, mine);
      posts = posts.filter(x => x !== p); renderBoard(); toast('삭제되었습니다.');
    } catch(err){ toast('삭제하지 못했습니다.'); }
  }
};
$('#boardReload').onclick = () => {
  const b = $('#boardReload'); b.classList.remove('spin'); void b.offsetWidth; b.classList.add('spin');
  loadBoard(false);
};
let bqTimer;
$('#bq').oninput = () => { clearTimeout(bqTimer); bqTimer = setTimeout(() => loadBoard(false), 350); };
$('#bqBtn').onclick = () => toggleSearch($('#bqBtn'), $('#bq'), () => loadBoard(false));
function openAdmin(){ $('#aPw').value = ''; $('#adminBox').classList.add('show'); setTimeout(() => $('#aEmail').focus(), 50); }
function closeAdmin(){ $('#adminBox').classList.remove('show'); }
async function adminLogin(){
  const email = $('#aEmail').value.trim(), password = $('#aPw').value;
  if (!email || !password) return;
  $('#aLogin').disabled = true;
  try {
    const res = await fetch(SB_URL + '/auth/v1/token?grant_type=password', { method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
    if (!res.ok) throw 0;
    const d = await res.json();
    setAdmin({ access_token: d.access_token, refresh_token: d.refresh_token, expires_at: d.expires_at || Date.now() / 1000 + d.expires_in });
    const isAdmin = await sb('/rest/v1/rpc/is_admin', { method: 'POST', body: '{}' });
    if (!isAdmin) { setAdmin(null); toast('관리자 권한이 없는 계정입니다.'); }
    else { closeAdmin(); toast('관리자로 로그인되었습니다.'); location.hash = '#board'; loadBoard(false); }
  } catch(e){ setAdmin(null); toast('로그인하지 못했습니다.'); }
  $('#aLogin').disabled = false;
}
$('#aLogin').onclick = adminLogin;
$('#adminIn').onclick = openAdmin;
$('#aClose').onclick = closeAdmin;
$('#aPw').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); adminLogin(); } });
$('#adminBox').addEventListener('click', e => { if (e.target.id === 'adminBox') closeAdmin(); });
$('#adminOut').onclick = async () => {
  try { await fetch(SB_URL + '/auth/v1/logout', { method: 'POST', headers: { apikey: SB_KEY, Authorization: 'Bearer ' + admin.access_token } }); } catch(e){}
  setAdmin(null); toast('로그아웃되었습니다.'); loadBoard(false);
};
setAdmin(admin);
$('#boardMore').onclick = () => loadBoard(true);
$('#bsort').onclick = e => {
  const b = e.target.closest('[data-s]'); if (!b || b.dataset.s === boardSort) return;
  boardSort = b.dataset.s;
  document.querySelectorAll('#bsort .chip').forEach(c => c.classList.toggle('on', c === b));
  posts = []; loadBoard(false);
};

$('#postBtn').onclick = async () => {
  if (!boardItems) return;
  const pw = $('#lPw').value, adult = $('#lAdult').checked;
  if (adult && !pw) { toast('성인 OOC는 비밀번호를 설정해야 합니다.'); $('#lPw').focus(); return; }
  const list = boardItems.map(({ t, c }) => ({ t: String(t || '').trim().slice(0, 60) || '제목 없음', c: String(c || '') })).filter(x => x.c.trim());
  const n = list.length;
  if (!n) return;
  if (n > 30) { toast('세트는 30개까지만 게시할 수 있습니다.'); return; }
  if (list.some(x => x.c.length > 4000)) { toast('OOC 하나당 4,000자까지만 게시할 수 있습니다.'); return; }
  if (list.reduce((a, x) => a + x.c.length, 0) > 20000) { toast('세트 전체는 20,000자까지만 게시할 수 있습니다.'); return; }
  const title = n > 1 ? ($('#lSeries').value.trim() || `${list[0].t} 외 ${n - 1}개`).slice(0, 60) : list[0].t;
  const c = n > 1 ? JSON.stringify({ i: list }) : list[0].c;
  const note = $('#lNote').value.trim().slice(0, 100);
  if (!confirm(adult ? '성인 OOC로 게시판에 게시하시겠습니까?' : '게시판에 게시하시겠습니까? 모든 사용자가 열람할 수 있습니다.')) return;
  $('#postBtn').disabled = true;
  try {
    const token = b64e(crypto.getRandomValues(new Uint8Array(18)));
    const body = pw ? await lock(n > 1 ? c : JSON.stringify({ c }), pw) : c;
    const rows = await sb('/rest/v1/posts?select=id', {
      method: 'POST', headers: { Prefer: 'return=representation' },
      body: JSON.stringify({ title, body, adult, locked: !!pw, count: n, ...(note ? { note } : {}), del_hash: await sha256hex(token) })
    });
    if (rows && rows[0]) { mine[rows[0].id] = token; writeLS(MINE_KEY, mine); }
    toast('게시되었습니다.');
    if (rows && rows[0]) { publishing = false; location.hash = '#post=' + rows[0].id; }
    if (boardLoaded) loadBoard(false);
  } catch(e){ toast(/banned/.test(e.message) ? '게시할 수 없는 표현이 포함되어 있습니다.' : '게시하지 못했습니다.'); }
  $('#postBtn').disabled = false;
};

let editing = null;
function openEditor(p){
  const list = postList(p); if (!list) return;
  editing = p;
  const multi = list.length > 1;
  $('#eTitle').value = p.title;
  $('#eNote').value = p.note || '';
  $('#eItems').innerHTML = list.map((x, k) => multi
    ? `<div class="sub"><input type="text" class="eT" maxlength="60" value="${esc(x.t)}"><textarea class="eC" spellcheck="false">${esc(x.c)}</textarea></div>`
    : `<textarea class="eC" spellcheck="false" style="margin-top:8px">${esc(x.c)}</textarea>`).join('');
  $('#editBox').classList.add('show');
}
function closeEditor(){ $('#editBox').classList.remove('show'); editing = null; }
$('#eClose').onclick = closeEditor;
$('#editBox').addEventListener('click', e => { if (e.target.id === 'editBox') closeEditor(); });
$('#eSave').onclick = async () => {
  const p = editing; if (!p) return;
  const multi = (p.count || 1) > 1;
  const cs = [...document.querySelectorAll('#eItems .eC')].map(t => t.value);
  const ts = [...document.querySelectorAll('#eItems .eT')].map(t => t.value.trim().slice(0, 60) || '제목 없음');
  const title = $('#eTitle').value.trim().slice(0, 60);
  const note = $('#eNote').value.trim().slice(0, 100);
  if (!title) { toast('제목을 입력해 주세요.'); return; }
  if (cs.some(c => !c.trim())) { toast('내용을 입력해 주세요.'); return; }
  if (cs.some(c => c.length > 4000)) { toast('OOC 하나당 4,000자까지만 게시할 수 있습니다.'); return; }
  if (cs.reduce((a, c) => a + c.length, 0) > 20000) { toast('세트 전체는 20,000자까지만 게시할 수 있습니다.'); return; }
  const list = multi ? cs.map((c, k) => ({ t: ts[k], c })) : [{ t: title, c: cs[0] }];
  const plain = multi ? JSON.stringify({ i: list }) : cs[0];
  $('#eSave').disabled = true;
  try {
    const body = p.locked ? await lock(multi ? plain : JSON.stringify({ c: cs[0] }), p.pw) : plain;
    const ok = await sb('/rest/v1/rpc/update_post', { method: 'POST', body: JSON.stringify({ pid: p.id, token: mine[p.id], new_title: title, new_body: body, new_note: note }) });
    if (!ok) { toast('수정할 수 없습니다.'); }
    else {
      Object.assign(p, { title, note: note || null, body });
      if (p.locked) p.open = list;
      closeEditor(); renderBoard(); toast('수정되었습니다.');
    }
  } catch(e){ toast(/banned/.test(e.message) ? '게시할 수 없는 표현이 포함되어 있습니다.' : /^404|PGRST202/.test(e.message) ? '수정 기능이 아직 준비되지 않았습니다.' : '수정하지 못했습니다. (' + String(e.message).split(' ')[0] + ')'); }
  $('#eSave').disabled = false;
};

let viewPostId = null;
async function openPost(id){
  viewPostId = null;
  viewMsg('불러오는 중입니다.');
  let p;
  try {
    const rows = await sb(`/rest/v1/posts?id=eq.${encodeURIComponent(id)}&select=id,title,body,adult,locked,count,note,downloads`);
    p = rows && rows[0];
  } catch(e){ viewMsg('불러오지 못했습니다.'); return; }
  if (!p) { viewMsg('삭제되었거나 볼 수 없는 게시물입니다.'); return; }
  viewPostId = p.id;
  const show = list => openShared({ i: list, n: p.note || '', h: p.title, adult: p.adult });
  if (p.locked) {
    viewLocked(p.body, plain => {
      const d = JSON.parse(plain);
      show(Array.isArray(d.i) ? d.i : [{ t: p.title, c: d.c }]);
    });
  } else show(postList(p));
}
$('#postLink').onclick = () => copyText(location.href, '링크가 복사되었습니다.');
async function checkHash(){
  const h = location.hash;
  try {
    if (h.startsWith('#e=')) viewLocked(h.slice(3));
    else if (h.startsWith('#p=')) openShared(await unpack(h.slice(3)));
    else if (h.startsWith('#s=')) openShared(legacyDec(h.slice(3)));
    else if (h.startsWith('#post=')) openPost(h.slice(6));
    else if (h === '#board') enterBoard();
    else if (h === '#admin') { enterBoard(); openAdmin(); }
    else leaveView();
  } catch(e){ viewMsg('올바르지 않은 링크입니다.'); }
}
window.addEventListener('hashchange', checkHash);

function merge(list){
  let added = 0;
  const seen = new Set(items.map(i => i.t + '\u0000' + i.c));
  list.forEach(o => {
    const n = normalize(o); if (!n) return;
    const k = n.t + '\u0000' + n.c; if (seen.has(k)) return;
    seen.add(k); items.push(n); added++;
  });
  return added;
}
$('#exportBtn').onclick = () => {
  if (!items.length) { toast('백업할 OOC가 없습니다.'); return; }
  const data = { app: 'ooc', version: 1, exported: new Date().toISOString(), snips, items: items.map(({ t, g, c }) => ({ t, g, c })) };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const d = new Date(), pad = n => String(n).padStart(2, '0');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `ooc-backup-${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
};
$('#importBtn').onclick = () => $('#file').click();
$('#file').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    const list = Array.isArray(data) ? data : (data.items || []);
    const n = merge(list);
    if (Array.isArray(data.snips)) {
      data.snips.map(toSnip).filter(Boolean).forEach(n => { if (!snips.some(o => o.l === n.l && o.x === n.x)) snips.push(n); });
      saveSnips(); renderSnips();
    }
    saveItems(); render();
    toast(n ? `${n}개를 불러왔습니다.` : '새로 추가된 항목이 없습니다.');
  } catch(err){ toast('파일을 읽지 못했습니다.'); }
};

(async function init(){
  const s = readLS(SNIP_KEY);
  snips = Array.isArray(s) ? s.map(toSnip).filter(Boolean) : DEFAULT_SNIPS.map(o => ({ ...o }));
  if (Array.isArray(s) && !readLS('ooc.snips.hash.v1')) {
    if (!snips.some(x => x.l === '#')) {
      const at = snips.findIndex(x => x.l === 'OOC:');
      snips.splice(at >= 0 ? at + 1 : snips.length, 0, { l: '#', x: '#' });
      saveSnips();
    }
    writeLS('ooc.snips.hash.v1', 1);
  }
  renderSnips();
  const stored = readLS(KEY);
  if (Array.isArray(stored)) items = stored;
  else {
    try {
      const r = await fetch('ooc.json', { cache: 'no-store' });
      if (r.ok) {
        const data = await r.json();
        merge(Array.isArray(data) ? data : (data.items || []));
        if (Array.isArray(data.snips) && !Array.isArray(s)) { snips = data.snips.map(toSnip).filter(Boolean); renderSnips(); saveSnips(); }
        saveItems();
      }
    } catch(e){}
  }
  render();
  checkHash();
  if (!location.hash || location.hash === '#') restoreDraft(); else draftPending = true;
})();
</script>
